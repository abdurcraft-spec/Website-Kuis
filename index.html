<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tugas Game Kuis</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-container">
      <!-- Header Info Berdampingan -->
      <header class="header-info">
        <div class="status-bar">
          <div class="badge" id="level-badge">
            <span class="badge-label">LEVEL</span>
            <span class="badge-value" id="level-txt">1 (Easy)</span>
          </div>
          <div class="divider"></div>
          <div class="badge" id="score-badge">
            <span class="badge-label">SKOR</span>
            <span class="badge-value" id="score-txt">0</span>
          </div>
        </div>
      </header>

      <main class="game-area">
        <span class="card-tag"> Pilih opsi yang benar! </span>
        <p class="question" id="question-txt">Memuat soal...</p>

        <!-- 4 Kartu Opsi Jawaban Berjajar Horizontal -->
        <div class="card-row" id="card-row"></div>

        <div id="feedback" class="feedback hidden"></div>
      </main>
    </div>

    <!-- Modal Level Up Kustom -->
    <div id="level-modal" class="modal-overlay hidden">
      <div class="modal-box">
        <div class="level-up-icon">⚡</div>
        <h2>LEVEL UP!</h2>
        <p id="modal-desc">Kamu naik ke level baru!</p>
        <button id="close-modal-btn" class="btn-continue">Lanjut Main</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
